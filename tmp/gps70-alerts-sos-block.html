<!-- wp:html -->
<style>
#gps70-alerts{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#gps70-alerts .g70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent}
#gps70-alerts .g70-hdr{padding:1rem 1.25rem 0;font-weight:600;font-size:.9375rem;color:#0f172a}
#gps70-alerts .g70-body{padding:1rem 1.25rem}
#gps70-alerts .g70-empty{text-align:center;padding:.5rem;color:#94a3b8;font-size:.8125rem}
#gps70-alerts .g70-sos{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:.75rem;background:#ef4444;color:#fff;border:none;border-radius:.75rem;font-size:1rem;font-weight:600;cursor:pointer;transition:opacity .15s}
#gps70-alerts .g70-sos:hover{opacity:.9}
</style>
<div id="gps70-alerts"><div class="g70-card"><div class="g70-hdr">Geofence Alerts</div><div class="g70-body"><div class="g70-empty">No active alerts</div></div></div><div style="margin-top:1rem"><button class="g70-sos" type="button" id="gps70-sos-btn">Emergency SOS</button></div></div>
<script>
(function(){
  const root=document.getElementById('gps70-alerts'); const side=document.getElementById('gps70-side-col'); if(side && root.parentElement!==side) side.appendChild(root);
  document.getElementById('gps70-sos-btn').addEventListener('click',()=>{if(confirm('Send an emergency SOS notification to your care circle members?')) alert('SOS notification sent!')});
})();
</script>
<!-- /wp:html -->
