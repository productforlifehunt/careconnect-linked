<!-- wp:html -->
<style>
#profile70-personal{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#profile70-personal .p70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent;margin-bottom:1rem}
#profile70-personal .p70-card-hdr{padding:1.25rem 1.5rem 0;font-weight:600;font-size:1rem;color:#0f172a}
#profile70-personal .p70-card-body{padding:1.5rem}
#profile70-personal .p70-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:640px){#profile70-personal .p70-grid{grid-template-columns:1fr}}
#profile70-personal .p70-label{display:block;margin-bottom:.25rem;font-size:.8125rem;font-weight:500;color:#334155}
#profile70-personal .p70-input,#profile70-personal .p70-textarea{width:100%;padding:.5rem .75rem;border:1px solid #e2e8f0;border-radius:.5rem;font-size:.875rem;outline:none;background:#fff;font-family:inherit}
#profile70-personal .p70-input:focus,#profile70-personal .p70-textarea:focus{border-color:#0d9488;box-shadow:0 0 0 2px rgba(13,148,136,.08)}
#profile70-personal .p70-textarea{resize:vertical}
#profile70-personal .p70-icon-wrap{position:relative}.p70-icon-wrap svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#94a3b8}.p70-icon-wrap input{padding-left:2.25rem}
#profile70-personal .p70-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border:none;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;background:#0d9488;color:#fff}
#profile70-personal .p70-empty{padding:1rem;color:#94a3b8;font-size:.875rem}
</style>
<div id="profile70-personal" class="p70-panel active" data-panel="personal">
  <div class="p70-card"><div class="p70-card-hdr">Personal Information</div><div class="p70-card-body"><div class="p70-empty">Loading form...</div></div></div>
</div>
<script>
(function(){
  const root=document.getElementById('profile70-personal');
  function esc(v){return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function render(){
    const api=window.__profile70;if(!api)return; const u=api.state.user;
    if(!u){root.innerHTML='<div class="p70-card"><div class="p70-card-body"><div class="p70-empty">Unable to load form</div></div></div>';return}
    root.innerHTML='<div class="p70-card"><div class="p70-card-hdr">Personal Information</div><div class="p70-card-body"><div class="p70-grid"><div><label class="p70-label">Full Name</label><input class="p70-input" id="p70-name" value="'+esc(u.name)+'"></div><div><label class="p70-label">Email</label><input class="p70-input" id="p70-email" value="'+esc(u.email)+'" disabled></div><div><label class="p70-label">Phone</label><input class="p70-input" id="p70-phone" value="'+esc(u.meta?.phone_number||'')+'"></div><div><label class="p70-label">Avatar URL</label><input class="p70-input" id="p70-avatar" value="'+esc(u.avatar_urls?.['96']||'')+'"></div></div><div style="margin-top:1rem"><label class="p70-label">Address</label><div class="p70-icon-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg><input class="p70-input" id="p70-address" value="'+esc(u.meta?.address||'')+'"></div></div><div style="margin-top:1rem"><label class="p70-label">About Me</label><textarea class="p70-textarea" id="p70-bio" rows="3">'+esc(u.description||'')+'</textarea></div><div style="margin-top:1rem"><button class="p70-btn" type="button" id="p70-save-personal">Save Changes</button></div></div></div>';
    document.getElementById('p70-save-personal').addEventListener('click',async()=>{
      const btn=document.getElementById('p70-save-personal'); btn.textContent='Saving...';
      try{await api.save({name:document.getElementById('p70-name').value,description:document.getElementById('p70-bio').value,meta:{phone_number:document.getElementById('p70-phone').value,address:document.getElementById('p70-address').value}});btn.textContent='Save Changes'}catch(e){btn.textContent='Save Changes';alert('Failed to save profile')}
    });
  }
  function bind(){const api=window.__profile70;if(!api)return false;api.on('data',render);api.on('tab',render);render();return true}
  if(!bind()){const t=setInterval(()=>{if(bind())clearInterval(t)},200)}
})();
</script>
<!-- /wp:html -->
