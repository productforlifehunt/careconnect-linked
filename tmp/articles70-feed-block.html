<!-- wp:html -->
<style>
#articles70-feed{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#articles70-feed .a70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent;padding:1.25rem;margin-bottom:1rem}
#articles70-feed .a70-top{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
#articles70-feed .a70-author{display:flex;align-items:center;gap:.75rem}
#articles70-feed .a70-avatar{width:40px;height:40px;border-radius:50%;background:rgba(13,148,136,.1);display:flex;align-items:center;justify-content:center;color:#0d9488;font-weight:500;font-size:.875rem;flex-shrink:0}
#articles70-feed .a70-name{font-weight:500;font-size:.9375rem;color:#0f172a}
#articles70-feed .a70-time{font-size:.7rem;color:#94a3b8}
#articles70-feed .a70-badge{display:inline-block;padding:.125rem .5rem;border-radius:9999px;font-size:.65rem;font-weight:500;margin-left:.5rem}
#articles70-feed .a70-user{background:#dbeafe;color:#1e40af}
#articles70-feed .a70-expert{background:#fef3c7;color:#92400e}
#articles70-feed .a70-official{background:#dcfce7;color:#166534}
#articles70-feed .a70-title{font-size:1rem;font-weight:600;color:#0f172a;margin:0 0 .5rem}
#articles70-feed .a70-body{font-size:.875rem;color:#475569;line-height:1.5;margin-bottom:.75rem;display:-webkit-box;display:box;line-clamp:4;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
#articles70-feed .a70-footer{display:flex;align-items:center;justify-content:space-between;padding-top:.75rem;border-top:1px solid #f1f5f9}
#articles70-feed .a70-vote{display:flex;align-items:center;gap:.25rem}
#articles70-feed .a70-vote-btn{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;cursor:pointer;border-radius:.25rem;color:#94a3b8;font-size:1rem}
#articles70-feed .a70-vote-btn:hover{background:#f1f5f9;color:#0d9488}
#articles70-feed .a70-count{font-size:.875rem;font-weight:600;color:#0f172a;min-width:24px;text-align:center}
#articles70-feed .a70-menu button{background:none;border:none;color:#64748b;font-size:.8125rem;cursor:pointer;padding:.25rem .5rem}
#articles70-feed .a70-empty{text-align:center;padding:3rem 1rem;color:#94a3b8;font-size:.875rem}
</style>
<div id="articles70-feed">
  <div class="a70-empty">Loading articles...</div>
</div>
<script>
(function(){
  const root=document.getElementById('articles70-feed');
  const badgeClass={user:'a70-user',expert:'a70-expert',official:'a70-official'};
  function timeAgo(d){const s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
  function strip(v){return (v||'').replace(/<[^>]*>/g,'')}
  function render(){
    const api=window.__articles70;if(!api)return; let items=api.state.items||[];
    if(api.state.filter==='mine'&&api.state.uid) items=items.filter(a=>a.author===api.state.uid);
    else if(api.state.filter!=='all'&&api.state.filter!=='mine') items=items.filter(a=>(a.meta?.article_type||'user')===api.state.filter);
    if(!items.length){root.innerHTML='<div class="a70-empty">No articles found</div>';return}
    root.innerHTML=items.map(a=>{const author=a._embedded?.author?.[0]?.name||'User'; const owned=a.author===api.state.uid; const type=a.meta?.article_type||'user'; const menu=owned?'<div class="a70-menu"><button type="button" onclick="window.__articles70.openModal({id:'+a.id+',title:'+JSON.stringify(a.title?.rendered||'')+',content:'+JSON.stringify(strip(a.content?.rendered||''))+',type:'+JSON.stringify(type)+'})">Edit</button><button type="button" onclick="window.__articles70.remove('+a.id+')">Delete</button></div>':''; return '<div class="a70-card"><div class="a70-top"><div class="a70-author"><div class="a70-avatar">'+author.charAt(0).toUpperCase()+'</div><div><div class="a70-name">'+author+'<span class="a70-badge '+(badgeClass[type]||'a70-user')+'">'+type+'</span></div><div class="a70-time">'+timeAgo(a.date)+'</div></div></div>'+menu+'</div>'+(a.title?.rendered?'<h3 class="a70-title">'+a.title.rendered+'</h3>':'')+'<div class="a70-body">'+strip(a.content?.rendered||'')+'</div><div class="a70-footer"><div class="a70-vote"><button class="a70-vote-btn" type="button" onclick="window.__articles70.save('+a.id+',{meta:{vote_count:' + ((a.meta?.vote_count||0)+1) + '}})">▲</button><span class="a70-count">'+(a.meta?.vote_count||0)+'</span><button class="a70-vote-btn" type="button" onclick="window.__articles70.save('+a.id+',{meta:{vote_count:' + ((a.meta?.vote_count||0)-1) + '}})">▼</button></div></div></div>';}).join('');
  }
  function bind(){const api=window.__articles70;if(!api)return false;api.on('data',render);api.on('filter',render);render();return true}
  if(!bind()){const t=setInterval(()=>{if(bind())clearInterval(t)},200)}
})();
</script>
<!-- /wp:html -->
