<!-- wp:html -->
<style>
#gps70-map{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#gps70-map .g70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden;min-height:400px}
#gps70-map .g70-map{width:100%;height:400px;background:#e2e8f0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:.875rem}
</style>
<div id="gps70-map">
  <div class="g70-card"><div class="g70-map" id="gps70-map-inner">Map loading...</div></div>
</div>
<script>
(function(){
  function mount(){const main=document.getElementById('gps70-main-col'); if(main && !document.getElementById('gps70-map')) main.appendChild(document.currentScript.previousElementSibling.previousElementSibling)}
  const root=document.getElementById('gps70-map');
  const mapEl=document.getElementById('gps70-map-inner');
  const main=document.getElementById('gps70-main-col'); if(main && root.parentElement!==main) main.appendChild(root);
  function initMap(){
    if(typeof L!=='undefined'){
      mapEl.innerHTML='';
      const map=L.map(mapEl).setView([40.7128,-74.006],12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
      L.marker([40.7128,-74.006]).addTo(map).bindPopup('Care Circle Member');
      return;
    }
    const css=document.createElement('link'); css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
    const js=document.createElement('script'); js.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'; js.onload=initMap; document.head.appendChild(js);
  }
  initMap();
})();
</script>
<!-- /wp:html -->
