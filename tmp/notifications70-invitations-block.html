<!-- wp:html -->
<style>
#notif70-invitations{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#notif70-invitations .n70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent;padding:1rem 1.25rem;margin-bottom:.75rem;display:flex;align-items:flex-start;gap:.75rem}
#notif70-invitations .n70-icon{width:40px;height:40px;border-radius:.75rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:1.125rem;background:rgba(168,85,247,.1);color:#a855f7}
#notif70-invitations .n70-body{flex:1;min-width:0}
#notif70-invitations .n70-title{font-size:.9375rem;font-weight:500;color:#0f172a;margin:0 0 .25rem}
#notif70-invitations .n70-desc{font-size:.8125rem;color:#64748b;margin:0}
#notif70-invitations .n70-time{font-size:.7rem;color:#94a3b8;margin-top:.25rem}
#notif70-invitations .n70-actions{display:flex;gap:.5rem;margin-top:.5rem}
#notif70-invitations .n70-btn{display:inline-flex;align-items:center;gap:.375rem;padding:.375rem .75rem;border:none;border-radius:.375rem;font-size:.75rem;font-weight:500;cursor:pointer}
#notif70-invitations .n70-accept{background:#0d9488;color:#fff}
#notif70-invitations .n70-decline{background:#fff;color:#ef4444;border:1px solid rgba(239,68,68,.3)}
#notif70-invitations .n70-empty{text-align:center;padding:3rem 1rem;color:#94a3b8;font-size:.875rem}
</style>
<div id="notif70-invitations" class="n70-panel" data-panel="invitations">
  <div class="n70-empty">Loading invitations...</div>
</div>
<script>
(function(){
  const root=document.getElementById('notif70-invitations');
  function timeAgo(d){const s=Math.floor((Date.now()-new Date(d).getTime())/1000);if(s<60)return'Just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago'}
  function strip(v){return (v||'').replace(/<[^>]*>/g,'')}
  function render(){
    const api=window.__notif70;if(!api)return;
    const items=(api.state.items||[]).filter(n=>(n.meta?.type||'')==='care_group_invite' && !n.meta?.responded);
    if(!items.length){root.innerHTML='<div class="n70-empty">No pending invitations</div>';return}
    root.innerHTML=items.map(n=>{
      return '<div class="n70-card"><div class="n70-icon">👥</div><div class="n70-body"><h3 class="n70-title">'+(n.title?.rendered||'Invitation')+'</h3><p class="n70-desc">'+strip(n.content?.rendered||'')+'</p><div class="n70-time">'+timeAgo(n.date)+'</div><div class="n70-actions"><button class="n70-btn n70-accept" type="button" onclick="window.__notif70.update('+n.id+',{meta:{...(window.__notif70.state.items.find(x=>x.id=='+n.id+')?.meta||{}),responded:true,response:\'accept\',is_read:true}})">Accept</button><button class="n70-btn n70-decline" type="button" onclick="window.__notif70.update('+n.id+',{meta:{...(window.__notif70.state.items.find(x=>x.id=='+n.id+')?.meta||{}),responded:true,response:\'decline\',is_read:true}})">Decline</button></div></div></div>';
    }).join('');
  }
  function bind(){const api=window.__notif70;if(!api)return false;api.on('data',render);api.on('tab',render);render();return true}
  if(!bind()){const t=setInterval(()=>{if(bind())clearInterval(t)},200)}
})();
</script>
<!-- /wp:html -->
