<!-- wp:html -->
<style>
#fav70-list{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#fav70-list .f70-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
#fav70-list .f70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent;padding:1.25rem}
#fav70-list .f70-top{display:flex;align-items:center;gap:.75rem;margin-bottom:.75rem}
#fav70-list .f70-avatar{width:48px;height:48px;border-radius:.75rem;background:rgba(13,148,136,.1);display:flex;align-items:center;justify-content:center;font-weight:600;color:#0d9488;font-size:1rem;flex-shrink:0}
#fav70-list .f70-name{font-weight:600;font-size:.9375rem;color:#0f172a}
#fav70-list .f70-specialty{font-size:.8125rem;color:#64748b}
#fav70-list .f70-rating{display:flex;align-items:center;gap:.25rem;font-size:.8125rem;color:#f59e0b;margin-top:.25rem}
#fav70-list .f70-rating svg{width:14px;height:14px;fill:#f59e0b}
#fav70-list .f70-meta{display:flex;flex-wrap:wrap;gap:.5rem;font-size:.75rem;color:#64748b;margin-bottom:.75rem}
#fav70-list .f70-actions{display:flex;gap:.5rem}
#fav70-list .f70-btn{display:inline-flex;align-items:center;justify-content:center;gap:.375rem;padding:.375rem .75rem;border:none;border-radius:.5rem;font-size:.8125rem;font-weight:500;cursor:pointer;text-decoration:none}
#fav70-list .f70-primary{background:#0d9488;color:#fff;flex:1}
#fav70-list .f70-ghost{background:transparent;color:#ef4444}
#fav70-list .f70-empty{text-align:center;padding:3rem 1rem;color:#94a3b8;font-size:.875rem}
</style>
<div id="fav70-list">
  <div class="f70-empty">Loading saved providers...</div>
</div>
<script>
(function(){
  const root=document.getElementById('fav70-list');
  function render(){
    const api=window.__fav70;if(!api)return; const items=api.state.items||[];
    if(!items.length){root.innerHTML='<div class="f70-empty">No saved providers yet</div>';return}
    root.innerHTML='<div class="f70-grid">'+items.map(p=>{
      const name=p.title?.rendered||'Provider'; const init=name.charAt(0).toUpperCase(); const specialty=p.meta?.specialty||'Care Provider';
      const rating=p.meta?.rating||''; const location=p.meta?.location||''; const rate=p.meta?.hourly_rate||'';
      return '<div class="f70-card"><div class="f70-top"><div class="f70-avatar">'+init+'</div><div><div class="f70-name">'+name+'</div><div class="f70-specialty">'+specialty+'</div>'+(rating?'<div class="f70-rating"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>'+rating+'</div>':'')+'</div></div><div class="f70-meta">'+(location?'<span>'+location+'</span>':'')+(rate?'<span>$'+rate+'/hr</span>':'')+'</div><div class="f70-actions"><a class="f70-btn f70-primary" href="/careconnected/store-listing/">Book</a><button class="f70-btn f70-ghost" type="button" onclick="window.__fav70.remove('+p.id+')">Remove</button></div></div>';
    }).join('')+'</div>';
  }
  function bind(){const api=window.__fav70;if(!api)return false;api.on('data',render);render();return true}
  if(!bind()){const t=setInterval(()=>{if(bind())clearInterval(t)},200)}
})();
</script>
<!-- /wp:html -->
