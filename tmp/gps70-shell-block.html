<!-- wp:html -->
<style>
#gps70-shell{max-width:64rem;margin:0 auto;padding:1.5rem 1rem;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#gps70-shell *{box-sizing:border-box}
#gps70-shell .g70-header{margin-bottom:1.5rem}
#gps70-shell .g70-header h1{font-size:1.5rem;font-weight:700;color:#0f172a;margin:0}
#gps70-shell .g70-header p{margin:.25rem 0 0;font-size:.875rem;color:#64748b}
#gps70-shell .g70-grid{display:grid;grid-template-columns:1fr 320px;gap:1rem}
@media(max-width:768px){#gps70-shell .g70-grid{grid-template-columns:1fr}}
#gps70-shell .g70-side{display:flex;flex-direction:column;gap:1rem}
</style>
<div id="gps70-shell">
  <div class="g70-header">
    <h1>GPS Tracking</h1>
    <p>Monitor your care circle members' locations</p>
  </div>
  <div class="g70-grid">
    <div id="gps70-main-col"></div>
    <div class="g70-side" id="gps70-side-col"></div>
  </div>
</div>
<script>
(function(){
  const base='/careconnected/wp-json/wp/v2';
  const state={items:[],sharing:false,listeners:{}};
  function emit(name){(state.listeners[name]||[]).forEach(fn=>{try{fn(state)}catch(e){}})}
  function on(name,fn){state.listeners[name]=state.listeners[name]||[];state.listeners[name].push(fn);return()=>state.listeners[name]=(state.listeners[name]||[]).filter(x=>x!==fn)}
  async function load(){
    try{const r=await fetch(base+'/care_group?per_page=10',{credentials:'include'});state.items=r.ok?await r.json():[]}catch(e){state.items=[]}
    emit('data')
  }
  function setSharing(v){state.sharing=!!v;emit('sharing')}
  window.__gps70={state,on,emit,load,setSharing};
  load();
})();
</script>
<!-- /wp:html -->
