<!-- wp:html -->
<style>
#provider70-schedule{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#provider70-schedule .pv70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent;margin-bottom:1rem}
#provider70-schedule .pv70-hdr{padding:1.25rem 1.5rem 0;font-weight:600;font-size:1rem;color:#0f172a}
#provider70-schedule .pv70-body{padding:1.25rem 1.5rem}
#provider70-schedule .pv70-grid{display:grid;gap:.5rem}
#provider70-schedule .pv70-day{display:flex;align-items:center;justify-content:space-between;padding:.75rem;border:1px solid #e2e8f0;border-radius:.5rem;gap:1rem;flex-wrap:wrap}
#provider70-schedule .pv70-day-name{font-weight:500;font-size:.875rem;color:#0f172a;width:100px}
#provider70-schedule .pv70-times{display:flex;gap:.5rem;align-items:center}
#provider70-schedule .pv70-input{padding:.375rem;border:1px solid #e2e8f0;border-radius:.375rem;font-size:.8125rem;width:90px}
#provider70-schedule .pv70-switch{width:44px;height:24px;border-radius:12px;background:#e2e8f0;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
#provider70-schedule .pv70-switch.on{background:#0d9488}
#provider70-schedule .pv70-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#provider70-schedule .pv70-switch.on::after{transform:translateX(20px)}
#provider70-schedule .pv70-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border:none;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;background:#0d9488;color:#fff}
</style>
<div id="provider70-schedule" class="pv70-panel" data-panel="schedule">
  <div class="pv70-card"><div class="pv70-hdr">Weekly Availability</div><div class="pv70-body"><div class="pv70-grid" id="pv70-schedule-grid"></div><div style="margin-top:1rem"><button class="pv70-btn" type="button" id="pv70-save-schedule">Save Schedule</button></div></div></div>
</div>
<script>
(function(){
  const root=document.getElementById('provider70-schedule');
  const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const grid=document.getElementById('pv70-schedule-grid');
  grid.innerHTML=days.map(d=>'<div class="pv70-day"><span class="pv70-day-name">'+d+'</span><div class="pv70-times"><input class="pv70-input" type="time" value="09:00"><span style="color:#94a3b8">to</span><input class="pv70-input" type="time" value="17:00"></div><button class="pv70-switch on" type="button"></button></div>').join('');
  root.querySelectorAll('.pv70-switch').forEach(btn=>btn.addEventListener('click',()=>btn.classList.toggle('on')));
  document.getElementById('pv70-save-schedule').addEventListener('click',()=>alert('Schedule saved!'));
})();
</script>
<!-- /wp:html -->
