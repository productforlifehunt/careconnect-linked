<!-- wp:html -->
<style>
#profile70-notifs{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
#profile70-notifs .p70-card{background:#fff;border-radius:.75rem;box-shadow:0 1px 3px rgba(0,0,0,.1);border:1px solid transparent;margin-bottom:1rem}
#profile70-notifs .p70-card-hdr{padding:1.25rem 1.5rem 0;font-weight:600;font-size:1rem;color:#0f172a}
#profile70-notifs .p70-card-body{padding:1.5rem}
#profile70-notifs .p70-row{display:flex;align-items:center;justify-content:space-between;padding:.5rem 0}
#profile70-notifs .p70-label{font-size:.875rem;color:#334155}
#profile70-notifs .p70-switch{width:44px;height:24px;border-radius:12px;background:#e2e8f0;position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
#profile70-notifs .p70-switch.on{background:#0d9488}
#profile70-notifs .p70-switch::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#profile70-notifs .p70-switch.on::after{transform:translateX(20px)}
#profile70-notifs .p70-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border:none;border-radius:.5rem;font-size:.875rem;font-weight:500;cursor:pointer;background:#0d9488;color:#fff}
#profile70-notifs .p70-empty{padding:1rem;color:#94a3b8;font-size:.875rem}
</style>
<div id="profile70-notifs" class="p70-panel" data-panel="notifications">
  <div class="p70-card"><div class="p70-card-hdr">Notification Preferences</div><div class="p70-card-body"><div class="p70-empty">Loading preferences...</div></div></div>
</div>
<script>
(function(){
  const root=document.getElementById('profile70-notifs');
  function render(){
    const api=window.__profile70;if(!api)return; const u=api.state.user;
    if(!u){root.innerHTML='<div class="p70-card"><div class="p70-card-body"><div class="p70-empty">Unable to load preferences</div></div></div>';return}
    const emailOn=(u.meta?.email_notification ?? true); const pushOn=(u.meta?.push_notification ?? true);
    root.innerHTML='<div class="p70-card"><div class="p70-card-hdr">Notification Preferences</div><div class="p70-card-body"><div class="p70-row"><div class="p70-label">Email Notifications</div><button class="p70-switch '+(emailOn?'on':'')+'" type="button" id="p70-email-switch"></button></div><div class="p70-row"><div class="p70-label">Push Notifications</div><button class="p70-switch '+(pushOn?'on':'')+'" type="button" id="p70-push-switch"></button></div><div style="margin-top:1rem"><button class="p70-btn" type="button" id="p70-save-notifs">Save Preferences</button></div></div></div>';
    document.getElementById('p70-email-switch').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));
    document.getElementById('p70-push-switch').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));
    document.getElementById('p70-save-notifs').addEventListener('click',async()=>{
      const btn=document.getElementById('p70-save-notifs'); btn.textContent='Saving...';
      try{await api.save({meta:{email_notification:document.getElementById('p70-email-switch').classList.contains('on'),push_notification:document.getElementById('p70-push-switch').classList.contains('on')}});btn.textContent='Save Preferences'}catch(e){btn.textContent='Save Preferences';alert('Failed to save preferences')}
    });
  }
  function bind(){const api=window.__profile70;if(!api)return false;api.on('data',render);api.on('tab',render);render();return true}
  if(!bind()){const t=setInterval(()=>{if(bind())clearInterval(t)},200)}
})();
</script>
<!-- /wp:html -->
